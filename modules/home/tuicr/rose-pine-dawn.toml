# Rose Pine Dawn (light) local theme for tuicr.
# Palette: https://rosepinetheme.com/palette (base #faf4ed, text #575279,
# love #b4637a, gold #ea9d34, rose #d7827e, pine #286983, foam #56949f,
# iris #907aa9, highlight low/med #f4ede8/#dfdad9, overlay #f2e9e1).
# Diff backgrounds are the accent blended ~25% over base.
# Additions use pine (stronger contrast than foam on the light base);
# border_focused keeps the foam accent to match the niri focus ring.

panel_bg = "#faf4ed"       # base
bg_highlight = "#dfdad9"   # highlight med
fg_primary = "#575279"     # text
fg_secondary = "#797593"   # subtle
fg_dim = "#9893a5"         # muted

diff_add = "#286983"       # pine
diff_add_bg = "#d1dcda"    # foam 25% over base
diff_del = "#b4637a"       # love
diff_del_bg = "#e8d0d0"    # love 25% over base
diff_context = "#575279"   # text
diff_hunk_header = "#907aa9" # iris
expanded_context_fg = "#9893a5" # muted

syntax_add_bg = "#d1dcda"
syntax_del_bg = "#e8d0d0"
# syntax_theme omitted: tuicr falls back to its bundled light syntax theme.

file_added = "#286983"     # pine
file_modified = "#ea9d34"  # gold
file_deleted = "#b4637a"   # love
file_renamed = "#907aa9"   # iris

reviewed = "#286983"       # pine
pending = "#ea9d34"        # gold

comment_note = "#ea9d34"       # gold (note = question)
comment_suggestion = "#56949f" # foam
comment_issue = "#b4637a"      # love
comment_praise = "#286983"     # pine

border_focused = "#56949f"   # foam, matches niri active focus ring
border_unfocused = "#dfdad9" # highlight med
status_bar_bg = "#f2e9e1"    # overlay
cursor_color = "#d7827e"     # rose
cursor_line_bg = "#f4ede8"   # highlight low
branch_name = "#907aa9"      # iris
help_indicator = "#797593"   # subtle

message_info_fg = "#faf4ed"
message_info_bg = "#56949f"    # foam
message_warning_fg = "#faf4ed"
message_warning_bg = "#ea9d34" # gold
message_error_fg = "#faf4ed"
message_error_bg = "#b4637a"   # love
update_badge_fg = "#faf4ed"
update_badge_bg = "#ea9d34"    # gold

mode_fg = "#faf4ed"
mode_bg = "#d7827e"            # rose
